<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç Kiralama | Profesyonel Filo Çözümleri</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">AVIS</div>
            <nav class="nav-links">
                <a href="#">Rezervasyon Yönetimi</a>
                <a href="#">Araçlar</a>
                <a href="#">Kampanyalar</a>
                <a href="#">Ofisler</a>
                <a href="#">Hizmetler</a>
                <a href="#">Yurt Dışı Araç Kiralama</a>
            </nav>
        </div>
    </header>

    <section class="banner-section">
        <a href="#cars-grid">
            <img src="assets/banner.png" alt="Avis Kampanya" class="banner-image">
        </a>
    </section>

    <div class="search-container-standalone">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Marka veya model arayın... (Örn: Megane, Civic)">
        </div>
    </div>

    <div class="subheader">
        <p>anasayfa / ofisten araç al /</p>
        <h2>Arama Sonucu: <span id="car-count">0</span> araç bulundu</h2>
    </div>

    <main class="main-content">
        <div class="cars-grid" id="cars-grid">
            <!-- Araçlar JavaScript ile buraya eklenecek -->
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 AVIS Araç Kiralama. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Floating Buttons -->
    <div class="floating-buttons">
        <a href="https://wa.me/905011101269" class="float-btn float-wp"><i class="fab fa-whatsapp"></i></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
